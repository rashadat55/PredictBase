<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ✅ KRİTİK EKSİK: Frame v2 Manifest bağlantısı (Bu olmadan Farcaster'da açılmaz) -->
    <link rel="farcaster-frame-manifest" href="https://predictbase-score.vercel.app/farcaster-frame-manifest.json">

    <!-- Farcaster Frame v2 Meta Tag -->
    <meta name="fc:frame" content='{"version":"next","imageUrl":"https://predictbase-score.vercel.app/preview.png","buttonTitle":"⚽ Predict & Win","splashImageUrl":"https://predictbase-score.vercel.app/icon.png","splashBackgroundColor":"#05070a"}' />
    
    <title>PredictBase — WC 2026</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- style.css dosyanızın var olduğundan ve doğru yolda olduğundan emin olun -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#05070a] text-white"> <!-- Arka plan rengini ekledim ki yüklenirken beyaz kalmasın -->

<div class="header-wrap px-4 py-3">
    <div class="flex justify-between items-center mb-3">
        <div class="font-display text-lg font-black text-green-400 tracking-tighter uppercase">⚽ PREDICTBASE WC2026</div>
        <div id="user-display" class="text-[9px] font-bold text-green-400 border border-green-500/20 px-3 py-1 rounded-lg uppercase">Connecting...</div>
    </div>
    <input type="text" id="match-search" class="search-bar text-black w-full p-2 rounded" placeholder="Search team (104 matches)...">
</div>

<div class="px-4 py-4">
    <div id="match-list" class="flex flex-col gap-4">
        <!-- Burası JS ile dolacak. Eğer dolmuyorsa JS hata veriyor demektir. -->
        <p class="text-center text-gray-500">Loading matches...</p>
    </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="predict-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100;">
    <div class="modal-sheet bg-white text-black p-6 rounded-t-3xl absolute bottom-0 w-full">
        <div class="flex justify-between items-center mb-8">
            <h2 id="modal-title" class="font-bold text-lg uppercase">PREDICT</h2>
            <button id="modal-close" class="text-gray-500 text-2xl">✕</button>
        </div>
        <div class="flex items-center justify-center gap-6 mb-10">
            <div class="flex flex-col items-center">
                <div id="m-home-flag" class="text-4xl mb-2"></div>
                <input id="s-home" type="number" class="w-16 border text-center text-xl" value="0">
                <div id="m-home-code" class="text-xs text-gray-500 mt-2">HOME</div>
            </div>
            <div class="text-2xl font-black">VS</div>
            <div class="flex flex-col items-center">
                <div id="m-away-flag" class="text-4xl mb-2"></div>
                <input id="s-away" type="number" class="w-16 border text-center text-xl" value="0">
                <div id="m-away-code" class="text-xs text-gray-500 mt-2">AWAY</div>
            </div>
        </div>
        <button id="confirm-btn" class="bg-green-500 text-white w-full py-4 rounded-xl font-bold uppercase">Confirm Prediction</button>
    </div>
</div>

<!-- game.js dosyasının doğru konumda olduğundan emin olun -->
<script type="module" src="game.js"></script>
</body>
</html>
