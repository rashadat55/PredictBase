<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Mobil görünüm için kritik: Zoom'u engeller -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Farcaster Frame v2 Meta Tag (Hata giderildi, Manifest ile tam uyumlu) -->
    <meta name="fc:frame" content='{"version":"next","imageUrl":"https://predictbase-score.vercel.app/preview.png","buttonTitle":"⚽ Predict & Win","splashImageUrl":"https://predictbase-score.vercel.app/icon.png","splashBackgroundColor":"#05070a"}' />
    
    <!-- Open Graph (Link paylaşıldığında güzel görünmesi için) -->
    <meta property="og:title" content="PredictBase WC2026" />
    <meta property="og:description" content="Predict WC 2026 matches and win USDC." />
    <meta property="og:image" content="https://predictbase-score.vercel.app/preview.png" />
    <meta property="og:url" content="https://predictbase-score.vercel.app" />

    <title>PredictBase — WC 2026</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header-wrap px-4 py-3">
    <div class="flex justify-between items-center mb-3">
        <div class="font-display text-lg font-black neon-g tracking-tighter uppercase">⚽ PREDICTBASE WC2026</div>
        <div id="user-display" class="text-[9px] font-bold text-green-400 border border-green-500/20 px-3 py-1 rounded-lg uppercase">Connecting...</div>
    </div>
    <input type="text" id="match-search" class="search-bar text-xs" placeholder="Search team, group, or stadium (104 matches)...">
</div>

<div class="px-4 py-4">
    <div id="match-list" class="flex flex-col gap-4"></div>
</div>

<div class="modal-bg" id="predict-modal">
    <div class="modal-sheet">
        <div class="flex justify-between items-center mb-8">
            <h2 id="modal-title" class="font-display text-lg font-black uppercase">PREDICT</h2>
            <button id="modal-close" class="text-gray-500 text-2xl">✕</button>
        </div>
        <div class="flex items-center justify-center gap-6 mb-10">
            <div class="flex flex-col items-center">
                <div id="m-home-flag" class="team-orb mb-2"></div>
                <input id="s-home" type="number" class="score-box" value="0" min="0">
                <span class="type-label">Score</span>
                <div id="m-home-code" class="text-[10px] text-gray-500 font-black mt-2 uppercase">HOME</div>
            </div>
            <div class="font-display text-3xl font-black text-gray-800 mt-[-30px]">VS</div>
            <div class="flex flex-col items-center">
                <div id="m-away-flag" class="team-orb mb-2"></div>
                <input id="s-away" type="number" class="score-box" value="0" min="0">
                <span class="type-label">Score</span>
                <div id="m-away-code" class="text-[10px] text-gray-500 font-black mt-2 uppercase">AWAY</div>
            </div>
        </div>
        <button id="confirm-btn" class="btn-primary w-full py-4 font-display text-sm uppercase tracking-widest">Confirm Prediction</button>
    </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
