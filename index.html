<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
<!-- Farcaster v2 Meta - Manifest ile tam uyumlu -->
<meta name="fc:frame" content='{"version":"next","imageUrl":"https://predictbase-score.vercel.app/preview.png","button":{"title":"⚽ Predict & Win","action":{"type":"launch_frame","name":"PredictBase WC2026","url":"https://predictbase-score.vercel.app/","splashImageUrl":"https://predictbase-score.vercel.app/icon.png","splashBackgroundColor":"#05070a"}}}' />
    
    <title>PredictBase — WC 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #05070a; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .neon-g { color: #10b981; text-shadow: 0 0 10px rgba(16,185,129,0.5); }
    </style>
</head>
<body>

<div class="px-4 py-3">
    <div class="flex justify-between items-center mb-3">
        <h1 class="neon-g font-black text-sm uppercase">⚽ PREDICTBASE</h1>
        <button id="wallet-btn" class="text-[9px] border border-emerald-500/30 px-3 py-1 rounded-lg text-emerald-500 font-bold uppercase">CONNECT</button>
    </div>
    <input type="text" id="match-search" class="w-full bg-white/5 border border-white/10 p-2 rounded-lg text-xs" placeholder="Search team...">
</div>

<div id="match-list" class="px-4 flex flex-col gap-4"></div>

<!-- Modal -->
<div id="predict-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
    <div class="bg-white text-black p-6 rounded-3xl w-[90%] max-w-sm">
        <h2 id="modal-title" class="text-center font-black mb-4">PREDICT</h2>
        <div class="flex justify-around items-center mb-6">
            <div class="text-center">
                <div id="m-home-flag" class="text-4xl"></div>
                <input id="s-home" type="number" class="w-12 border-b-2 text-center text-xl font-bold" value="0">
            </div>
            <div class="font-bold">VS</div>
            <div class="text-center">
                <div id="m-away-flag" class="text-4xl"></div>
                <input id="s-away" type="number" class="w-12 border-b-2 text-center text-xl font-bold" value="0">
            </div>
        </div>
        <button id="confirm-btn" class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold">CONFIRM</button>
        <button id="modal-close" class="w-full text-gray-400 mt-2 text-sm">Cancel</button>
    </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
